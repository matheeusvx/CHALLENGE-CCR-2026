services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_CORS_ORIGINS: http://localhost:3000
      API_OUTPUT_ROOT: outputs/satellite_monitoring
      ANALYSIS_TIMEZONE: America/Sao_Paulo
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/motiva.db}
      MULTISOURCE_ENABLED: ${MULTISOURCE_ENABLED:-false}
      SENTINEL1_ENABLED: ${SENTINEL1_ENABLED:-false}
      SENTINEL1_COLLECTION: ${SENTINEL1_COLLECTION:-sentinel-1-grd}
      SENTINEL1_MAX_SCENES: ${SENTINEL1_MAX_SCENES:-8}
      MULTISOURCE_FUSION_MODE: ${MULTISOURCE_FUSION_MODE:-disabled}
      HEIGHT_ESTIMATION_ENABLED: ${HEIGHT_ESTIMATION_ENABLED:-false}
      SPATIAL_SEGMENTATION_ENABLED: ${SPATIAL_SEGMENTATION_ENABLED:-false}
      SPATIAL_SECTION_LENGTH_M: ${SPATIAL_SECTION_LENGTH_M:-50}
      SPATIAL_REGULARIZATION_ENABLED: ${SPATIAL_REGULARIZATION_ENABLED:-false}
      BETA_AUTH_ENABLED: ${BETA_AUTH_ENABLED:-true}
      BETA_AUTH_COOKIE_SECURE: ${BETA_AUTH_COOKIE_SECURE:-false}
      BETA_AUTH_EMAIL_PEPPER: ${BETA_AUTH_EMAIL_PEPPER}
      BETA_GROUP_EMAIL_DIGEST: ${BETA_GROUP_EMAIL_DIGEST}
      BETA_GROUP_PASSWORD_HASH: ${BETA_GROUP_PASSWORD_HASH}
      BETA_MOTIVA_EMAIL_DIGEST: ${BETA_MOTIVA_EMAIL_DIGEST}
      BETA_MOTIVA_PASSWORD_HASH: ${BETA_MOTIVA_PASSWORD_HASH}
      BETA_AUTH_TOKEN_SECRET: ${BETA_AUTH_TOKEN_SECRET}
      BETA_PROXY_SECRET: ${BETA_PROXY_SECRET}
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/workspace/outputs
      # O historico de analises vive em data/motiva.db e precisa sobreviver
      # ao ciclo de vida do container.
      - ./data:/workspace/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      BACKEND_API_URL: http://api:8000
      BETA_PROXY_SECRET: ${BETA_PROXY_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
