services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_CORS_ORIGINS: http://localhost:3000
      API_OUTPUT_ROOT: outputs/satellite_monitoring
      ANALYSIS_TIMEZONE: America/Sao_Paulo
      HEIGHT_ESTIMATION_ENABLED: ${HEIGHT_ESTIMATION_ENABLED:-false}
      SPATIAL_SEGMENTATION_ENABLED: ${SPATIAL_SEGMENTATION_ENABLED:-false}
      SPATIAL_REGULARIZATION_ENABLED: ${SPATIAL_REGULARIZATION_ENABLED:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/workspace/outputs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
